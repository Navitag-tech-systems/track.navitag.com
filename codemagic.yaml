# Codemagic CI/CD  —  track.navitag.com (Capacitor 8 / Vue 3 / Vite)
# Docs: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
#
# IMPORTANT: Codemagic does NOT read this repo's .env file. Every secret below
# comes from Codemagic variable GROUPS / INTEGRATIONS / CODE SIGNING configured
# in the Codemagic web UI. The .env file is only your local staging vault.
#
# One-time UI setup these workflows depend on:
#   - Code signing identities -> Android keystores: upload your .jks
#         reference name MUST be:  navitag_upload_keystore
#   - Integrations -> App Store Connect: add your API key (.p8)
#         integration name MUST be: Navitag_ASC_API_Key
#   - Environment variables (create these groups):
#         github_packages :  GITHUB_PACKAGES_TOKEN
#         google_play     :  GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  (paste the JSON contents, secret)

workflows:

  # ==========================================================================
  # ANDROID  ->  Google Play (internal testing track)
  # ==========================================================================
  android-google-play:
    name: Android -> Google Play (internal)
    instance_type: mac_mini_m2          # free-tier minutes are macOS M2; swap to linux_x2 if you have Linux minutes
    max_build_duration: 60
    environment:
      node: 22.17.0
      java: 21
      android_signing:
        - navitag_upload_keystore       # must match the keystore reference name in Codemagic UI
      groups:
        - github_packages               # GITHUB_PACKAGES_TOKEN
        - google_play                   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "com.navitag.track"
    scripts:
      - name: Authenticate to GitHub Packages and install deps
        script: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > .npmrc.local
          npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Compute Android build number (above every uploaded bundle)
        # get-latest-build-number only sees ACTIVE track releases, so a discarded
        # draft makes it drop back and re-propose an already-uploaded (and thus
        # permanently reserved) version code -> "Version code N has already been
        # used". next-build-number.mjs reads the full bundle/apk upload library
        # (which retains discarded-draft uploads), so it always steps above the
        # true ceiling. Needs GCLOUD_SERVICE_ACCOUNT_CREDENTIALS + PACKAGE_NAME (set).
        script: |
          set -e
          NEXT=$(node scripts/next-build-number.mjs)
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Android versionCode -> $NEXT"
      - name: Verify Android plugin allow-list (keeps RevenueCat/IAP off Android)
        # android.includePlugins is an ALLOW-list that replaces the dependency
        # scan, so a newly added plugin is silently missing from Android only —
        # the AAB still builds and the app throws "not implemented on android"
        # on a device. Fail here instead.
        script: node scripts/check-android-plugins.mjs
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Point Gradle at the Codemagic Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build signed release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal                 # internal -> closed -> beta -> production (promote in Play Console)
        submit_as_draft: false          # app is established (v5.0.0 already live) -> publish live straight
                                         # to internal testers; no manual finalize in Play Console needed.

  # ==========================================================================
  # ANDROID  ->  Google Play (PRODUCTION track, DRAFT)
  #   Identical build to the internal workflow, but publishes to the production
  #   track as a DRAFT release: it is created in Play Console for you to review
  #   and click "Roll out" (it does NOT go live automatically).
  #   NOTE: the first production rollout also requires the Play Console
  #   "App content" declarations (data safety, content rating, app access,
  #   privacy policy, target audience) to be complete, or Console blocks rollout.
  # ==========================================================================
  android-production:
    name: Android -> Google Play (production draft)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.17.0
      java: 21
      android_signing:
        - navitag_upload_keystore
      groups:
        - github_packages
        - google_play
      vars:
        PACKAGE_NAME: "com.navitag.track"
    scripts:
      - name: Authenticate to GitHub Packages and install deps
        script: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > .npmrc.local
          npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Compute Android build number (above every uploaded bundle)
        # See the android-google-play note: steps above the true uploaded-bundle
        # ceiling so a discarded draft can't cause a reused ("already been used")
        # version code. Needs GCLOUD_SERVICE_ACCOUNT_CREDENTIALS + PACKAGE_NAME (set).
        script: |
          set -e
          NEXT=$(node scripts/next-build-number.mjs)
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Android versionCode -> $NEXT"
      - name: Verify Android plugin allow-list (keeps RevenueCat/IAP off Android)
        # android.includePlugins is an ALLOW-list that replaces the dependency
        # scan, so a newly added plugin is silently missing from Android only —
        # the AAB still builds and the app throws "not implemented on android"
        # on a device. Fail here instead.
        script: node scripts/check-android-plugins.mjs
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Point Gradle at the Codemagic Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build signed release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true           # DRAFT production release -> finalize / roll out in Play Console

  # ==========================================================================
  # iOS  ->  TestFlight   (flip the flags at the bottom to also submit to App Store)
  # ==========================================================================
  ios-testflight:
    name: iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Navitag_ASC_API_Key   # must match the API key name in Codemagic UI -> Integrations
    environment:
      node: 22.17.0
      xcode: 26.3                               # 26.4.1 crashes resolving the SPM graph after RevenueCat
                                                #   was added (IDESwiftPackageCore off-by-one, Abort trap 6).
      groups:
        - github_packages
        - ios_signing                           # CERTIFICATE_PRIVATE_KEY (2048-bit RSA) — lets
                                                #   fetch-signing-files --create mint the dist cert + profile
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"   # SPM-based Capacitor project: no .xcworkspace / CocoaPods
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: "6758300749"            # numeric Apple ID (App Store Connect -> App Information)
                                                  # -> build numbers auto-increment above existing TestFlight builds.
    scripts:
      - name: Authenticate to GitHub Packages and install deps
        script: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > .npmrc.local
          npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Sync Capacitor (iOS)
        script: npx cap sync ios
      - name: Set iOS build number (above the latest already in App Store Connect)
        script: |
          set -e
          if [ -n "$APP_STORE_APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          else
            LATEST=$BUILD_NUMBER
          fi
          cd ios/App
          agvtool new-version -all $(($LATEST + 1))
      - name: Set up code signing (creates the cert + App Store profile if missing)
        script: |
          set -e   # without this, a fetch-signing-files failure silently passed the step
          keychain initialize
          app-store-connect fetch-signing-files "com.navitag.track" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --delete-stale-profiles
          keychain add-certificates
          xcode-project use-profiles
      - name: Resolve Swift packages (SPM pre-resolve; RevenueCat pulls purchases-ios remotely)
        # Capacitor 8 is SPM-based. `xcode-project build-ipa` runs
        # `xcodebuild -showBuildSettings` first, which fails ("Failed to show
        # build settings", exit 250) if the packages aren't resolved yet — and
        # it swallows the real error. Resolving here both surfaces any genuine
        # resolution error in the log AND lets the subsequent showBuildSettings
        # succeed. `cat` the manifest so we can see the exact deps being resolved.
        script: |
          set -e
          echo "=== xcode in use ===" && xcodebuild -version
          # ROOT CAUSE of the earlier Abort-trap-6 crash: a STALE Package.resolved
          # (committed pre-RevenueCat) whose entry count no longer matches the live
          # graph. Xcode 16+/26 strictly validate this and crash in
          # IDESwiftPackageCore ("count of array (N) differs from index set (N-1)").
          # Capacitor regenerates Package.swift every build, so any committed
          # Package.resolved is unreliable — wipe it (+ DerivedData) for a clean resolve.
          find ios -name "Package.resolved" -print -delete 2>/dev/null || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true
          echo "--- resolving Swift package dependencies (clean) ---"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # ---- After the TestFlight build is validated, uncomment to push to App Store review ----
        # submit_to_app_store: true
        # release_type: MANUAL          # you press "Release" in App Store Connect after approval

  # ==========================================================================
  # RELEASE  ->  Android + iOS together. ONE aligned version (from package.json)
  #              + ONE aligned build number. All-or-nothing: both binaries are
  #              built before anything publishes, and the iOS TestFlight upload
  #              gates the Google Play publish (Android only publishes if iOS did).
  # ==========================================================================
  release:
    name: Release (Android + iOS, aligned)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Navitag_ASC_API_Key
    environment:
      node: 22.17.0
      java: 21
      android_signing:
        - navitag_upload_keystore
      groups:
        - github_packages
        - google_play
      vars:
        BUNDLE_ID: "com.navitag.track"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: "6758300749"
    scripts:
      - name: Authenticate to GitHub Packages and install deps
        script: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > .npmrc.local
          npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Compute aligned version + build number
        # ANDROID_NEXT steps above the true uploaded-bundle ceiling (so a discarded
        # Play draft can't cause a reused version code); the final build number is
        # also kept above the latest TestFlight build so both platforms stay aligned.
        script: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          ANDROID_NEXT=$(PACKAGE_NAME="$BUNDLE_ID" node scripts/next-build-number.mjs)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          TF_NEXT=$(( TF + 1 ))
          NEXT=$(( ANDROID_NEXT > TF_NEXT ? ANDROID_NEXT : TF_NEXT ))
          echo "APP_VERSION=$VERSION" >> $CM_ENV
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Aligned -> version=$VERSION  build=$NEXT  (android_next=$ANDROID_NEXT testflight=$TF)"
      - name: Verify Android plugin allow-list (keeps RevenueCat/IAP off Android)
        # android.includePlugins is an ALLOW-list that replaces the dependency
        # scan, so a newly added plugin is silently missing from Android only —
        # the AAB still builds and the app throws "not implemented on android"
        # on a device. Fail here instead.
        script: node scripts/check-android-plugins.mjs
      - name: Sync Capacitor (both platforms)
        script: |
          npx cap sync android
          npx cap sync ios
      - name: Point Gradle at the Codemagic Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build signed Android AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
      - name: Set iOS marketing version + build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Publish IPA to TestFlight (gates release; retries transient ASC 500s)
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Publishing $IPA"
          for i in 1 2 3; do
            if app-store-connect publish --path "$IPA" --max-build-processing-wait 0; then
              echo "iOS upload OK"; exit 0
            fi
            echo "attempt $i failed (likely transient App Store Connect 500); waiting 90s"; sleep 90
          done
          echo "iOS publish failed after 3 attempts"; exit 1
    artifacts:
      - android/app/build/outputs/**/*.aab
      - build/ios/ipa/*.ipa
    publishing:
      # Runs only after ALL scripts succeed (including the iOS upload) -> Android
      # publishes only if iOS already uploaded. This is the all-or-nothing gate.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
