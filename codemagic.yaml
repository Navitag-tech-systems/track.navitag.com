# Codemagic CI/CD  —  track.navitag.com (Capacitor 8 / Vue 3 / Vite)
# Docs: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
#
# IMPORTANT: Codemagic does NOT read this repo's .env file. Every secret below
# comes from Codemagic variable GROUPS / INTEGRATIONS / CODE SIGNING configured
# in the Codemagic web UI. The .env file is only your local staging vault.
#
# One-time UI setup these workflows depend on:
#   - Code signing identities -> Android keystores: upload your .jks
#         reference name MUST be:  navitag_upload_keystore
#   - Integrations -> App Store Connect: add your API key (.p8)
#         integration name MUST be: Navitag_ASC_API_Key
#   - Environment variables (create these groups):
#         github_packages :  GITHUB_PACKAGES_TOKEN
#         google_play     :  GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  (paste the JSON contents, secret)

workflows:

  # ==========================================================================
  # ANDROID  ->  Google Play (internal testing track)
  # ==========================================================================
  android-google-play:
    name: Android -> Google Play (internal)
    instance_type: mac_mini_m2          # free-tier minutes are macOS M2; swap to linux_x2 if you have Linux minutes
    max_build_duration: 60
    environment:
      node: 22.17.0
      java: 21
      android_signing:
        - navitag_upload_keystore       # must match the keystore reference name in Codemagic UI
      groups:
        - github_packages               # GITHUB_PACKAGES_TOKEN
        - google_play                   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "com.navitag.track"
    scripts:
      - name: Authenticate to GitHub Packages and install deps
        script: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > .npmrc.local
          npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Compute Android build number (above the latest on Google Play)
        # Without this, Codemagic's per-workflow BUILD_NUMBER starts at 1 and
        # Play rejects the upload ("Version code N has already been used").
        # versionCode must be strictly greater than the highest already on Play.
        script: |
          set -e
          PLAY=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS 2>/dev/null || echo 0)
          NEXT=$(( PLAY + 1 ))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Android versionCode -> $NEXT (latest on Play=$PLAY)"
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Point Gradle at the Codemagic Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build signed release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal                 # internal -> closed -> beta -> production (promote in Play Console)
        submit_as_draft: true           # NOTE: the very first release of a brand-new app usually must be
                                         # uploaded/finalized manually in Play Console before the API will accept it.

  # ==========================================================================
  # iOS  ->  TestFlight   (flip the flags at the bottom to also submit to App Store)
  # ==========================================================================
  ios-testflight:
    name: iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Navitag_ASC_API_Key   # must match the API key name in Codemagic UI -> Integrations
    environment:
      node: 22.17.0
      groups:
        - github_packages
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"   # SPM-based Capacitor project: no .xcworkspace / CocoaPods
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: "6758300749"            # numeric Apple ID (App Store Connect -> App Information)
                                                  # -> build numbers auto-increment above existing TestFlight builds.
    scripts:
      - name: Authenticate to GitHub Packages and install deps
        script: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > .npmrc.local
          npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Sync Capacitor (iOS)
        script: npx cap sync ios
      - name: Set iOS build number (above the latest already in App Store Connect)
        script: |
          set -e
          if [ -n "$APP_STORE_APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          else
            LATEST=$BUILD_NUMBER
          fi
          cd ios/App
          agvtool new-version -all $(($LATEST + 1))
      - name: Set up code signing (creates the cert + App Store profile if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.navitag.track" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # ---- After the TestFlight build is validated, uncomment to push to App Store review ----
        # submit_to_app_store: true
        # release_type: MANUAL          # you press "Release" in App Store Connect after approval

  # ==========================================================================
  # RELEASE  ->  Android + iOS together. ONE aligned version (from package.json)
  #              + ONE aligned build number. All-or-nothing: both binaries are
  #              built before anything publishes, and the iOS TestFlight upload
  #              gates the Google Play publish (Android only publishes if iOS did).
  # ==========================================================================
  release:
    name: Release (Android + iOS, aligned)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Navitag_ASC_API_Key
    environment:
      node: 22.17.0
      java: 21
      android_signing:
        - navitag_upload_keystore
      groups:
        - github_packages
        - google_play
      vars:
        BUNDLE_ID: "com.navitag.track"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: "6758300749"
    scripts:
      - name: Authenticate to GitHub Packages and install deps
        script: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" > .npmrc.local
          npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Compute aligned version + build number
        script: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          PLAY=$(google-play get-latest-build-number --package-name "$BUNDLE_ID" --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS 2>/dev/null || echo 0)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEXT=$(( (PLAY > TF ? PLAY : TF) + 1 ))
          echo "APP_VERSION=$VERSION" >> $CM_ENV
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Aligned -> version=$VERSION  build=$NEXT  (play=$PLAY testflight=$TF)"
      - name: Sync Capacitor (both platforms)
        script: |
          npx cap sync android
          npx cap sync ios
      - name: Point Gradle at the Codemagic Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build signed Android AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
      - name: Set iOS marketing version + build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Publish IPA to TestFlight (gates release; retries transient ASC 500s)
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Publishing $IPA"
          for i in 1 2 3; do
            if app-store-connect publish --path "$IPA" --max-build-processing-wait 0; then
              echo "iOS upload OK"; exit 0
            fi
            echo "attempt $i failed (likely transient App Store Connect 500); waiting 90s"; sleep 90
          done
          echo "iOS publish failed after 3 attempts"; exit 1
    artifacts:
      - android/app/build/outputs/**/*.aab
      - build/ios/ipa/*.ipa
    publishing:
      # Runs only after ALL scripts succeed (including the iOS upload) -> Android
      # publishes only if iOS already uploaded. This is the all-or-nothing gate.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
