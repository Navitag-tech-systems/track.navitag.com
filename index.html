<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <!-- TEST: force the webview to attach a Referer on cross-origin subresources
         (e.g. Leaflet map tiles). iOS WKWebView appears to send NO Referer for
         the app's local (https://localhost) origin, so LocationIQ's referrer
         allow-list rejects tile <img> requests with 403 (Android's Chromium
         sends https://localhost and works). unsafe-url is the strongest force;
         tighten to "origin" for production if this works. -->
    <meta name="referrer" content="unsafe-url">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Navitag">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Navitag Track</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
